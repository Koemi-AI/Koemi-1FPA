[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "koemi"
version = "0.2.0"
description = "Koemi-2OBOV byte-level recurrent training architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "torch>=2.8"]

[project.optional-dependencies]
datasets = ["datasets>=3.0"]

[project.scripts]
koemi = "koemi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
